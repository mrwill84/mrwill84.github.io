```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智律云AI平台 v1.0</title>
<style>
  /* 全局样式 */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: #f5f7fa;
    color: #333;
    line-height: 1.6;
  }

  /* 头部样式 */
  header {
    background-color: #2d8cf0;
    padding: 20px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 24px;
    font-weight: 600;
  }

  /* 主要内容区域 */
.main-container {
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

/* 标题 */
.page-title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #333;
}

/* 合同详情顶部区域 */
.contract-header {
  background-color: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  margin-bottom: 30px;
}

/* 用户角色与操作按钮区域 */
.role-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.role-label {
  font-weight: 600;
  font-size: 16px;
  color: #333;
}

.current-role {
  font-size: 16px;
  padding: 4px 12px;
  background-color: #e0f7fa;
  color: #00796b;
  border-radius: 4px;
  font-weight: 500;
  margin-left: 10px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.action-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
  transition: background-color 0.3s, box-shadow 0.3s;
}

.action-btn:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.btn-primary {
  background-color: #2d8cf0;
  color: #fff;
}

.btn-primary:hover {
  background-color: #1e7edb;
}

.btn-disabled {
  background-color: #ccc;
  color: #666;
  cursor: not-allowed;
  position: relative;
}

.btn-disabled:hover {
  box-shadow: none;
}

/* 悬浮提示样式 */
.tooltip {
  position: absolute;
  background-color: rgba(0,0,0,0.75);
  color: #fff;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 13px;
  max-width: 250px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.tooltip.show {
  opacity: 1;
}

/* 合同内容区域 */
.contract-details {
  background-color: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* 其他内容占位 */
.placeholder {
  height: 300px;
  background-color: #eaeaea;
  border-radius: 4px;
  margin-top: 20px;
}

/* 响应式调整 */
@media(max-width: 768px) {
  .role-info {
    flex-direction: column;
    align-items: flex-start;
  }
  .actions {
    margin-top: 10px;
  }
}
</style>
</head>
<body>

<header>
  <h1>智律云AI平台 v1.0</h1>
</header>

<div class="main-container">
  <div class="page-title">合同详情</div>
  
  <!-- 合同顶部区域 -->
  <div class="contract-header">
    <!-- 用户角色与权限操作 -->
    <div class="role-info">
      <div>
        <span class="role-label">当前角色：</span>
        <span class="current-role" id="user-role">合同创建者</span>
      </div>
      <div class="actions" id="action-buttons">
        <!-- 操作按钮将通过脚本动态生成 -->
      </div>
    </div>
  </div>
  
  <!-- 合同内容区域 -->
  <div class="contract-details">
    <h3>合同基本信息</h3>
    <p>这里显示合同的详细信息，包括合同编号、签署日期、合同状态等内容。</p>
    <div class="placeholder"></div>
  </div>
</div>

<!-- 悬浮提示框 -->
<div class="tooltip" id="tooltip"></div>

<script>
  // 模拟用户角色和权限
  const userRole = '审核员'; // 当前用户角色
  const permissions = {
    '合同创建者': ['编辑合同', '提交审核'],
    '审核员': ['审核合同', '退回修改'],
    '审批人': ['审批合同', '拒绝审批'],
    '合规人员': ['合规审核', '提出修改建议'],
    '管理员': ['全部操作']
  };

  // 定义所有操作按钮
  const allActions = [
    { name: '编辑合同', label: '编辑', permission: ['合同创建者', '管理员'], icon: '✏️' },
    { name: '提交审核', label: '提交审核', permission: ['合同创建者', '管理员'], icon: '🚀' },
    { name: '审核合同', label: '审核', permission: ['审核员', '管理员'], icon: '✅' },
    { name: '退回修改', label: '退回', permission: ['审核员', '管理员'], icon: '↩️' },
    { name: '审批合同', label: '审批', permission: ['审批人', '管理员'], icon: '📝' },
    { name: '拒绝审批', label: '拒绝', permission: ['审批人', '管理员'], icon: '❌' },
    { name: '合规审核', label: '合规审核', permission: ['合规人员', '管理员'], icon: '🔍' },
    { name: '提出修改建议', label: '建议', permission: ['合规人员', '管理员'], icon: '💡' }
  ];

  // 获取操作按钮容器
  const actionContainer = document.getElementById('action-buttons');
  const tooltip = document.getElementById('tooltip');

  // 根据角色生成按钮
  function generateActionButtons(role) {
    actionContainer.innerHTML = '';
    allActions.forEach(action => {
      const btn = document.createElement('button');
      btn.className = 'action-btn';
      // 判断用户是否有权限
      if (action.permission.includes(role) || role === '管理员') {
        btn.disabled = false;
        btn.classList.add('btn-primary');
        btn.title = '';
      } else {
        btn.disabled = true;
        btn.classList.add('btn-disabled');
        btn.title = '权限不足：需要 ' + action.permission.join(' 或 ');
      }
      // 添加悬浮提示
      btn.addEventListener('mouseenter', (e) => {
        if (btn.disabled) {
          showTooltip(e, '权限不足：需要 ' + action.permission.join(' 或 '));
        }
      });
      btn.addEventListener('mousemove', (e) => {
        if (btn.disabled) {
          moveTooltip(e);
        }
      });
      btn.addEventListener('mouseleave', () => {
        hideTooltip();
      });
      // 按钮内容
      btn.innerHTML = `${action.icon} ${action.label}`;
      // 点击事件（示意）
      btn.addEventListener('click', () => {
        alert(`执行操作：${action.label}`);
      });
      // 添加到容器
      actionContainer.appendChild(btn);
    });
  }

  // 悬浮提示函数
  function showTooltip(event, text) {
    tooltip.innerText = text;
    tooltip.classList.add('show');
    moveTooltip(event);
  }

  function moveTooltip(event) {
    const rect = event.target.getBoundingClientRect();
    tooltip.style.top = (rect.top - 40) + 'px';
    tooltip.style.left = rect.left + 'px';
  }

  function hideTooltip() {
    tooltip.classList.remove('show');
  }

  // 初始化
  generateActionButtons(userRole);
</script>
</body>
</html>
