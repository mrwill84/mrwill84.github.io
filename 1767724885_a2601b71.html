```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智律云AI平台 v1.0</title>
<style>
  /* 全局样式 */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: #f5f7fa;
    color: #333;
    line-height: 1.6;
  }

  /* 头部样式 */
  header {
    background-color: #2d8cf0;
    padding: 20px;
    color: #fff;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
  }

  /* 容器 */
  .container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 20px;
  }

  /* 搜索区 */
  .search-section {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .search-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 15px;
    color: #333;
  }

  /* 搜索输入框 */
  .search-input-group {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
  }

  .search-input-group input[type="text"] {
    flex: 1;
    padding: 10px 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    transition: border-color 0.2s;
  }

  .search-input-group input[type="text"]:focus {
    border-color: #2d8cf0;
    outline: none;
  }

  /* 高亮匹配段落 */
  .search-results {
    max-height: 300px;
    overflow-y: auto;
    margin-top: 10px;
  }

  .result-item {
    padding: 10px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }

  .result-item:last-child {
    border-bottom: none;
  }

  /* 过滤器区 */
  .filter-section {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .filter-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 15px;
    color: #333;
  }

  /* 过滤器项 */
  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }

  .filter-item {
    flex: 1 1 200px;
    display: flex;
    flex-direction: column;
  }

  .filter-item label {
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 14px;
    color: #555;
  }

  /* 结构化过滤：下拉菜单或多选框 */
  select, input[type="checkbox"], input[type="range"] {
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }

  /* 按钮组 */
  .button-group {
    margin-top: 15px;
    display: flex;
    gap: 10px;
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  button.primary {
    background-color: #2d8cf0;
    color: #fff;
  }

  button.primary:hover {
    background-color: #1e6fcf;
  }

  button.secondary {
    background-color: #ccc;
    color: #333;
  }

  button.secondary:hover {
    background-color: #999;
  }

  /* 结果表格区 */
  .result-table {
    width: 100%;
    border-collapse: collapse;
    background-color: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .result-table th, .result-table td {
    padding: 12px 15px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    text-align: left;
  }

  .result-table th {
    background-color: #f0f0f0;
    font-weight: 600;
  }

  /* 高亮匹配段落样式 */
  .highlight {
    background-color: yellow;
  }

  /* 页脚 */
  footer {
    padding: 20px;
    text-align: center;
    background-color: #f0f0f0;
    color: #555;
    font-size: 14px;
  }

  /* 响应式调整 */
  @media(max-width: 768px) {
    .filter-group {
      flex-direction: column;
    }
    .button-group {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<header>
  智律云AI平台 v1.0
</header>

<div class="container">

  <!-- 搜索区 -->
  <section class="search-section">
    <div class="search-title">全文检索</div>
    <div class="search-input-group">
      <input type="text" id="search-input" placeholder="请输入关键词或布尔查询..." />
    </div>
    <div class="search-results" id="search-results">
      <!-- 高亮匹配段落将显示在这里 -->
    </div>
  </section>

  <!-- 过滤器区 -->
  <section class="filter-section">
    <div class="filter-title">筛选条件</div>
    <div class="filter-group">
      <!-- 关键条款 -->
      <div class="filter-item">
        <label for="key-clauses">关键条款</label>
        <select id="key-clauses" multiple>
          <option value="条款A">条款A</option>
          <option value="条款B">条款B</option>
          <option value="条款C">条款C</option>
          <option value="条款D">条款D</option>
        </select>
      </div>
      <!-- 风险等级 -->
      <div class="filter-item">
        <label for="risk-level">风险等级</label>
        <select id="risk-level">
          <option value="">全部</option>
          <option value="低">低</option>
          <option value="中">中</option>
          <option value="高">高</option>
        </select>
      </div>
      <!-- 合同状态 -->
      <div class="filter-item">
        <label for="contract-status">合同状态</label>
        <select id="contract-status">
          <option value="">全部</option>
          <option value="草稿">草稿</option>
          <option value="签署">签署</option>
          <option value="终止">终止</option>
          <option value="完成">完成</option>
        </select>
      </div>
      <!-- 到期提醒 -->
      <div class="filter-item">
        <label for="due-reminder">到期提醒</label>
        <select id="due-reminder">
          <option value="">全部</option>
          <option value="一周内">一周内</option>
          <option value="一月内">一月内</option>
          <option value="已到期">已到期</option>
        </select>
      </div>
      <!-- 金额区间 -->
      <div class="filter-item">
        <label>金额区间（万）</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="number" id="amount-min" placeholder="最小" style="width:80px;" />
          <span>—</span>
          <input type="number" id="amount-max" placeholder="最大" style="width:80px;" />
        </div>
      </div>
    </div>
    <!-- 按钮 -->
    <div class="button-group">
      <button class="primary" id="apply-filters">应用筛选</button>
      <button class="secondary" id="save-filter">保存筛选器</button>
      <button class="secondary" id="export-results">导出结果</button>
    </div>
  </section>

  <!-- 结果表格区 -->
  <section class="result-section">
    <div class="search-title">筛选结果</div>
    <table class="result-table" id="result-table">
      <thead>
        <tr>
          <th>合同编号</th>
          <th>关键条款</th>
          <th>风险等级</th>
          <th>合同状态</th>
          <th>到期日期</th>
          <th>金额（万）</th>
          <th>内容摘要</th>
        </tr>
      </thead>
      <tbody>
        <!-- 结果数据将动态填充 -->
        <tr>
          <td>HT2023001</td>
          <td>条款A</td>
          <td>中</td>
          <td>签署</td>
          <td>2023-12-31</td>
          <td>500</td>
          <td>本合同涉及...<span class="highlight">风险控制</span>措施已落实。</td>
        </tr>
        <tr>
          <td>HT2023002</td>
          <td>条款B</td>
          <td>高</td>
          <td>终止</td>
          <td>2023-10-15</td>
          <td>1200</td>
          <td>合同因...<span class="highlight">违约</span>被终止。</td>
        </tr>
        <!-- 更多示例行 -->
      </tbody>
    </table>
  </section>

</div>

<!-- 页脚 -->
<footer>
  &copy; 2023 智律云AI平台. 保留所有权利。
</footer>

<!-- 脚本区 -->
<script>
  // 简单示例：模拟搜索高亮
  document.getElementById('search-input').addEventListener('input', function() {
    const query = this.value.trim();
    const resultsContainer = document.getElementById('search-results');
    resultsContainer.innerHTML = '';

    if (!query) return;

    // 模拟匹配内容
    const sampleParagraphs = [
      '合同内容涉及风险控制措施已落实。',
      '本合同因违约被终止。',
      '合同条款A详细说明了双方责任。',
      '风险等级为中，建议注意风险控制。',
      '合同到期提醒：2023-12-31。',
    ];

    sampleParagraphs.forEach(text => {
      if (text.includes(query)) {
        // 高亮匹配
        const regex = new RegExp(`(${query})`, 'gi');
        const highlightedText = text.replace(regex, '<span class="highlight">$1</span>');
        const div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = highlightedText;
        resultsContainer.appendChild(div);
      }
    });
  });

  // 过滤按钮事件
  document.getElementById('apply-filters').addEventListener('click', function() {
    // 这里可以添加过滤逻辑
    alert('筛选条件已应用（示例）');
  });

  document.getElementById('save-filter').addEventListener('click', function() {
    // 保存筛选器逻辑
    alert('筛选器已保存（示例）');
  });

  document.getElementById('export-results').addEventListener('click', function() {
    // 导出逻辑
    alert('导出结果（示例）');
  });
</script>
</body>
</html>
