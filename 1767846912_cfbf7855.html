<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">⚖️</div>
            <div class="logo-text">智律云</div>
            <div class="logo-subtitle">合同审核AI平台</div>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">邮箱/用户名</label>
                <input type="text" id="username" class="form-input" placeholder="请输入邮箱或用户名" required>
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                    <button type="button" class="password-toggle" id="passwordToggle">👁️</button>
                </div>
            </div>

            <div id="captchaSection" class="captcha-section" style="display: none;">
                <label class="captcha-label">验证码</label>
                <input type="text" id="captchaInput" class="captcha-input" placeholder="请输入验证码" maxlength="4">
                <div class="captcha-image" id="captchaImage">1234</div>
                <button type="button" class="captcha-refresh" id="captchaRefresh">刷新验证码</button>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe" class="checkbox-input">
                <label for="rememberMe" class="checkbox-label">记住我</label>
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">忘记密码？</a>
            </div>

            <button type="submit" class="login-button" id="loginButton">登录</button>
        </form>

        <div class="register-link">
            没有账户？<a href="#" id="registerLink">立即注册</a>
        </div>
    </div>

    <div id="mfaModal" class="mfa-modal">
        <div class="mfa-content">
            <div class="mfa-title">多因素认证</div>
            <div class="mfa-description">请输入您的认证器应用中显示的6位数字代码</div>
            <input type="text" id="mfaCode" class="mfa-code-input" placeholder="000000" maxlength="6" inputmode="numeric">
            <div class="mfa-button-group">
                <button type="button" class="mfa-button mfa-confirm" id="mfaConfirm">验证</button>
                <button type="button" class="mfa-button mfa-cancel" id="mfaCancel">取消</button>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const captchaSection = document.getElementById('captchaSection');
        const captchaImage = document.getElementById('captchaImage');
        const captchaInput = document.getElementById('captchaInput');
        const captchaRefresh = document.getElementById('captchaRefresh');
        const mfaModal = document.getElementById('mfaModal');
        const mfaCode = document.getElementById('mfaCode');
        const mfaConfirm = document.getElementById('mfaConfirm');
        const mfaCancel = document.getElementById('mfaCancel');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const registerLink = document.getElementById('registerLink');

        let loginAttempts = 0;
        let isLocked = false;
        let lockTime = 0;
        let currentCaptcha = '';
        let mfaRequired = false;
        let sessionToken = '';

        function generateCaptcha() {
            currentCaptcha = Math.floor(1000 + Math.random() * 9000).toString();
            captchaImage.textContent = currentCaptcha;
            captchaInput.value = '';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }

        function checkLockStatus() {
            if (isLocked) {
                const remainingTime = Math.ceil((lockTime - Date.now()) / 1000);
                if (remainingTime > 0) {
                    showError(`账户已锁定，请在 ${remainingTime} 秒后重试`);
                    return true;
                } else {
                    isLocked = false;
                    loginAttempts = 0;
                }
            }
            return false;
        }

        function lockAccount() {
            isLocked = true;
            lockTime = Date.now() + 300000;
            loginButton.disabled = true;
            showError('登录失败次数过多，账户已锁定5分钟');
        }

        passwordToggle.addEventListener('click', (e) => {
            e.preventDefault();
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            passwordToggle.textContent = type === 'password' ? '👁️' : '🙈';
        });

        captchaRefresh.addEventListener('click', (e) => {
            e.preventDefault();
            generateCaptcha();
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (checkLockStatus()) {
                return;
            }

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            if (loginAttempts >= 2 && !captchaSection.style.display.includes('block')) {
                captchaSection.style.display = 'block';
                generateCaptcha();
                showError('请完成验证码验证');
                return;
            }

            if (captchaSection.style.display.includes('block')) {
                if (captchaInput.value !== currentCaptcha) {
                    showError('验证码错误，请重试');
                    generateCaptcha();
                    return;
                }
            }

            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="button-loading"><span class="loading-spinner"></span>登录中...</span>';

            try {
                await new Promise(resolve => setTimeout(resolve, 1500));

                if (username === 'admin' && password === 'admin123') {
                    loginAttempts = 0;
                    captchaSection.style.display = 'none';
                    mfaRequired = true;
                    sessionToken = 'temp_' + Math.random().toString(36).substr(2, 9);
                    mfaModal.classList.add('show');
                    mfaCode.focus();
                    showSuccess('用户名和密码验证成功，请进行多因素认证');
                } else {
                    loginAttempts++;
                    if (loginAttempts >= 3) {
                        lockAccount();
                    } else {
                        showError(`用户名或密码错误 (${loginAttempts}/3)`);
                    }
                }
            } catch (error) {
                showError('登录请求失败，请检查网络连接后重试');
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = '登录';
            }
        });

        mfaConfirm.addEventListener('click', async () => {
            const code = mfaCode.value.trim();

            if (!code || code.length !== 6) {
                showError('请输入6位数字代码');
                return;
            }

            if (!/^\d{6}$/.test(code)) {
                showError('请输入有效的数字代码');
                return;
            }

            mfaConfirm.disabled = true;
            mfaConfirm.innerHTML = '<span class="button-loading"><span class="loading-spinner"></span>验证中...</span>';

            try {
                await new Promise(resolve => setTimeout(resolve, 1000));

                if (code === '123456') {
                    mfaModal.classList.remove('show');
                    showSuccess('登录成功！正在跳转...');
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    window.location.href = '/dashboard';
                } else {
                    showError('认证码错误，请重试');
                    mfaCode.value = '';
                    mfaCode.focus();
                }
            } catch (error) {
                showError('验证请求失败，请重试');
            } finally {
                mfaConfirm.disabled = false;
                mfaConfirm.textContent = '验证';
            }
        });

        mfaCancel.addEventListener('click', () => {
            mfaModal.classList.remove('show');
            mfaCode.value = '';
            mfaRequired = false;
            sessionToken = '';
            loginButton.disabled = false;
        });

        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            showSuccess('密码重置链接已发送到您的邮箱，请检查收件箱');
        });

        registerLink.addEventListener('click', (e) => {
            e.preventDefault();
            showSuccess('跳转到注册页面...');
            setTimeout(() => {
                window.location.href = '/register';
            }, 1500);
        });

        mfaCode.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                mfaConfirm.click();
            }
        });

        loginForm.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !mfaRequired) {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        setInterval(() => {
            if (isLocked) {
                const remainingTime = Math.ceil((lockTime - Date.now()) / 1000);
                if (remainingTime <= 0) {
                    isLocked = false;
                    loginAttempts = 0;
                    loginButton.disabled = false;
                    showSuccess('账户已解锁，请重新登录');
                }
            }
        }, 1000);
    </script>
</body>
</html>
