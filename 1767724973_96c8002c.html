<script>
  // 模拟数据
  const totalContracts = 1000000; // 百万级别
  const pageSize = 20;
  let currentPage = 1;
  let totalPages = Math.ceil(totalContracts / pageSize);
  let contractsData = [];

  // 生成模拟合同数据
  function generateContracts() {
    for (let i = 1; i <= totalContracts; i++) {
      contractsData.push({
        id: 'HT' + String(i).padStart(8, '0'),
        name: '合同名称 ' + i,
        date: new Date(2020 + (i % 3), (i % 12), (i % 28) + 1).toISOString().slice(0,10),
        status: (i % 3 === 0) ? '已签订' : (i % 3 === 1) ? '审核中' : '待签订'
      });
    }
  }

  generateContracts();

  // 获取当前页合同数据
  function getPageData(page) {
    const start = (page - 1) * pageSize;
    const end = start + pageSize;
    return contractsData.slice(start, end);
  }

  // 渲染合同表格
  function renderTable(page) {
    const tbody = document.querySelector('#contractTable tbody');
    tbody.innerHTML = '';
    const data = getPageData(page);
    data.forEach(contract => {
      const tr = document.createElement('tr');

      const tdId = document.createElement('td');
      tdId.textContent = contract.id;
      tr.appendChild(tdId);

      const tdName = document.createElement('td');
      tdName.textContent = contract.name;
      tr.appendChild(tdName);

      const tdDate = document.createElement('td');
      tdDate.textContent = contract.date;
      tr.appendChild(tdDate);

      const tdStatus = document.createElement('td');
      tdStatus.textContent = contract.status;
      tr.appendChild(tdStatus);

      const tdAction = document.createElement('td');
      const viewBtn = document.createElement('button');
      viewBtn.textContent = '查看';
      viewBtn.style.padding = '6px 12px';
      viewBtn.style.border = 'none';
      viewBtn.style.borderRadius = '4px';
      viewBtn.style.backgroundColor = '#1890ff';
      viewBtn.style.color = '#fff';
      viewBtn.style.cursor = 'pointer';
      viewBtn.onclick = () => showContractDetail(contract);
      tdAction.appendChild(viewBtn);
      tr.appendChild(tdAction);

      tbody.appendChild(tr);
    });
  }

  // 更新分页按钮状态
  function updatePagination() {
    const buttons = document.querySelectorAll('.page-btn');
    buttons.forEach(btn => {
      const page = btn.dataset.page;
      if (page === 'prev') {
        btn.disabled = currentPage === 1;
        btn.style.cursor = currentPage === 1 ? 'not-allowed' : 'pointer';
        btn.style.opacity = currentPage === 1 ? 0.5 : 1;
      } else if (page === 'next') {
        btn.disabled = currentPage === totalPages;
        btn.style.cursor = currentPage === totalPages ? 'not-allowed' : 'pointer';
        btn.style.opacity = currentPage === totalPages ? 0.5 : 1;
      } else if (page === 'first') {
        // 首页按钮
        // 这里没有对应按钮，改为首页
      } else if (page === 'last') {
        // 尾页按钮
      } else {
        // 数字按钮
        if (parseInt(page) === currentPage) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    });
  }

  // 初始化分页按钮
  function initPagination() {
    const controls = document.getElementById('paginationControls');
    controls.innerHTML = '';

    const firstBtn = document.createElement('button');
    firstBtn.textContent = '首页';
    firstBtn.className = 'page-btn';
    firstBtn.dataset.page = '1';
    firstBtn.onclick = () => {
      currentPage = 1;
      renderTable(currentPage);
      updatePagination();
    };
    controls.appendChild(firstBtn);

    const prevBtn = document.createElement('button');
    prevBtn.textContent = '上一页';
    prevBtn.className = 'page-btn';
    prevBtn.dataset.page = 'prev';
    prevBtn.onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        renderTable(currentPage);
        updatePagination();
      }
    };
    controls.appendChild(prevBtn);

    // 生成中间页码按钮（简化，只显示前后各2页）
    const maxPageButtons = 5;
    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, currentPage + 2);
    if (currentPage <= 3) {
      startPage = 1;
      endPage = Math.min(totalPages, 5);
    }
    if (currentPage >= totalPages - 2) {
      startPage = Math.max(1, totalPages - 4);
      endPage = totalPages;
    }

    for (let i = startPage; i <= endPage; i++) {
      const pageBtn = document.createElement('button');
      pageBtn.textContent = i;
      pageBtn.className = 'page-btn';
      pageBtn.dataset.page = i;
      pageBtn.onclick = () => {
        currentPage = i;
        renderTable(currentPage);
        updatePagination();
      };
      controls.appendChild(pageBtn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.textContent = '下一页';
    nextBtn.className = 'page-btn';
    nextBtn.dataset.page = 'next';
    nextBtn.onclick = () => {
      if (currentPage < totalPages) {
        currentPage++;
        renderTable(currentPage);
        updatePagination();
      }
    };
    controls.appendChild(nextBtn);

    const lastBtn = document.createElement('button');
    lastBtn.textContent = '尾页';
    lastBtn.className = 'page-btn';
    lastBtn.dataset.page = 'last';
    lastBtn.onclick = () => {
      currentPage = totalPages;
      renderTable(currentPage);
      updatePagination();
    };
    controls.appendChild(lastBtn);

    // 更新按钮状态
    updatePagination();
  }

  // 显示合同详情
  function showContractDetail(contract) {
    const modal = document.getElementById('contractDetailModal');
    const contentDiv = document.getElementById('contractDetailContent');
    contentDiv.innerHTML = `
      <p><strong>合同编号：</strong> ${contract.id}</p>
      <p><strong>合同名称：</strong> ${contract.name}</p>
      <p><strong>签订日期：</strong> ${contract.date}</p>
      <p><strong>状态：</strong> ${contract.status}</p>
      <p><strong>详细信息：</strong> 这是合同的详细内容，包含合同条款、签署方信息等。</p>
    `;
    modal.style.display = 'flex';

    // 模拟加载时间
    // 可以在此添加异步请求，确保加载时间小于2秒
  }

  // 关闭合同详情
  document.getElementById('closeDetail').onclick = () => {
    document.getElementById('contractDetailModal').style.display = 'none';
  };

  // 点击弹窗外关闭
  window.onclick = (event) => {
    const modal = document.getElementById('contractDetailModal');
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  };

  // 搜索按钮事件
  document.getElementById('searchBtn').onclick = () => {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    if (keyword === '') {
      // 重新加载全部
      totalPages = Math.ceil(totalContracts / pageSize);
      currentPage = 1;
      renderTable(currentPage);
      initPagination();
      return;
    }
    // 简单搜索模拟
    const filteredContracts = contractsData.filter(c => c.id.toLowerCase().includes(keyword) || c.name.toLowerCase().includes(keyword));
    totalContractsFiltered = filteredContracts.length;
    totalPages = Math.ceil(totalContractsFiltered / pageSize);
    contractsDataFiltered = filteredContracts;
    currentPage = 1;
    renderFilteredTable(currentPage);
    initPagination();
  };

  // 刷新按钮事件
  document.getElementById('refreshBtn').onclick = () => {
    document.getElementById('searchInput').value = '';
    totalPages = Math.ceil(totalContracts / pageSize);
    currentPage = 1;
    renderTable(currentPage);
    initPagination();
  };

  // 初始化
  let totalContractsFiltered = totalContracts;
  let contractsDataFiltered = [...contractsData];

  function renderFilteredTable(page) {
    const tbody = document.querySelector('#contractTable tbody');
    tbody.innerHTML = '';
    const data = contractsDataFiltered.slice((page - 1) * pageSize, page * pageSize);
    data.forEach(contract => {
      const tr = document.createElement('tr');

      const tdId = document.createElement('td');
      tdId.textContent = contract.id;
      tr.appendChild(tdId);

      const tdName = document.createElement('td');
      tdName.textContent = contract.name;
      tr.appendChild(tdName);

      const tdDate = document.createElement('td');
      tdDate.textContent = contract.date;
      tr.appendChild(tdDate);

      const tdStatus = document.createElement('td');
      tdStatus.textContent = contract.status;
      tr.appendChild(tdStatus);

      const tdAction = document.createElement('td');
      const viewBtn = document.createElement('button');
      viewBtn.textContent = '查看';
      viewBtn.style.padding = '6px 12px';
      viewBtn.style.border = 'none';
      viewBtn.style.borderRadius = '4px';
      viewBtn.style.backgroundColor = '#1890ff';
      viewBtn.style.color = '#fff';
      viewBtn.style.cursor = 'pointer';
      viewBtn.onclick = () => showContractDetail(contract);
      tdAction.appendChild(viewBtn);
      tr.appendChild(tdAction);

      tbody.appendChild(tr);
    });
  }

  // 初始化页面
  window.onload = () => {
    renderTable(currentPage);
    initPagination();
  };
</script>
</body>
</html>
