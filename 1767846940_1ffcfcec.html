```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智律云合同审核AI平台 - 注册</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-lg shadow-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-600 mb-2">智律云</h1>
                <p class="text-gray-600 text-sm">合同审核AI平台</p>
                <p class="text-gray-500 text-xs mt-1">创建新账号</p>
            </div>

            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">姓名/公司名</label>
                    <input type="text" id="fullName" name="fullName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入姓名或公司名称">
                    <span class="text-red-500 text-xs mt-1 hidden" id="fullNameError"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入邮箱地址">
                    <span class="text-red-500 text-xs mt-1 hidden" id="emailError"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">手机号（可选）</label>
                    <input type="tel" id="phone" name="phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入手机号码">
                    <span class="text-red-500 text-xs mt-1 hidden" id="phoneError"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请设置密码">
                    <div class="mt-2 space-y-1">
                        <div class="flex items-center text-xs">
                            <span class="w-2 h-2 rounded-full mr-2" id="lengthCheck" style="background-color: #ccc;"></span>
                            <span class="text-gray-600">至少8个字符</span>
                        </div>
                        <div class="flex items-center text-xs">
                            <span class="w-2 h-2 rounded-full mr-2" id="uppercaseCheck" style="background-color: #ccc;"></span>
                            <span class="text-gray-600">包含大写字母</span>
                        </div>
                        <div class="flex items-center text-xs">
                            <span class="w-2 h-2 rounded-full mr-2" id="numberCheck" style="background-color: #ccc;"></span>
                            <span class="text-gray-600">包含数字</span>
                        </div>
                        <div class="flex items-center text-xs">
                            <span class="w-2 h-2 rounded-full mr-2" id="specialCheck" style="background-color: #ccc;"></span>
                            <span class="text-gray-600">包含特殊字符(!@#$%^&*)</span>
                        </div>
                    </div>
                    <div class="mt-2 h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div id="passwordStrength" class="h-full w-0 bg-red-500 transition-all duration-300"></div>
                    </div>
                    <span class="text-red-500 text-xs mt-1 hidden" id="passwordError"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请再次输入密码">
                    <span class="text-red-500 text-xs mt-1 hidden" id="confirmPasswordError"></span>
                </div>

                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">验证码</label>
                        <input type="text" id="verificationCode" name="verificationCode" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="请输入验证码">
                        <span class="text-red-500 text-xs mt-1 hidden" id="verificationCodeError"></span>
                    </div>
                    <div class="flex flex-col justify-end">
                        <button type="button" id="sendCodeBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium whitespace-nowrap">发送验证码</button>
                    </div>
                </div>

                <div class="flex items-start gap-2 pt-2">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required class="mt-1 w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500">
                    <label for="agreeTerms" class="text-xs text-gray-600">
                        我已阅读并同意
                        <a href="#" class="text-blue-600 hover:underline">《服务条款》</a>
                        和
                        <a href="#" class="text-blue-600 hover:underline">《隐私政策》</a>
                    </label>
                </div>
                <span class="text-red-500 text-xs mt-1 hidden block" id="agreeTermsError"></span>

                <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium mt-6">注册账号</button>

                <div class="text-center pt-4 border-t border-gray-200">
                    <p class="text-gray-600 text-sm">已有账号？<a href="#" class="text-blue-600 hover:underline font-medium">返回登录</a></p>
                </div>
            </form>

            <div id="successMessage" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-green-800 text-sm font-medium">注册成功！</p>
                <p class="text-green-700 text-xs mt-1">欢迎邮件已发送，请查收。系统将在3秒后自动跳转...</p>
            </div>

            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-red-800 text-sm font-medium" id="errorText"></p>
            </div>
        </div>

        <div class="text-center mt-6 text-gray-500 text-xs">
            <p>© 2024 智律云合同审核AI平台 | 版权所有</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const fullNameInput = document.getElementById('fullName');
        const verificationCodeInput = document.getElementById('verificationCode');
        const agreeTermsCheckbox = document.getElementById('agreeTerms');

        let codeCountdown = 0;
        let verificationCodeSent = false;

        passwordInput.addEventListener('input', function() {
            validatePasswordStrength(this.value);
        });

        function validatePasswordStrength(password) {
            const lengthCheck = password.length >= 8;
            const uppercaseCheck = /[A-Z]/.test(password);
            const numberCheck = /[0-9]/.test(password);
            const specialCheck = /[!@#$%^&*]/.test(password);

            document.getElementById('lengthCheck').style.backgroundColor = lengthCheck ? '#10b981' : '#ccc';
            document.getElementById('uppercaseCheck').style.backgroundColor = uppercaseCheck ? '#10b981' : '#ccc';
            document.getElementById('numberCheck').style.backgroundColor = numberCheck ? '#10b981' : '#ccc';
            document.getElementById('specialCheck').style.backgroundColor = specialCheck ? '#10b981' : '#ccc';

            const strength = [lengthCheck, uppercaseCheck, numberCheck, specialCheck].filter(Boolean).length;
            const strengthBar = document.getElementById('passwordStrength');
            const strengthPercentage = (strength / 4) * 100;

            strengthBar.style.width = strengthPercentage + '%';

            if (strength <= 1) {
                strengthBar.style.backgroundColor = '#ef4444';
            } else if (strength <= 2) {
                strengthBar.style.backgroundColor = '#f97316';
            } else if (strength <= 3) {
                strengthBar.style.backgroundColor = '#eab308';
            } else {
                strengthBar.style.backgroundColor = '#10b981';
            }
        }

        sendCodeBtn.addEventListener('click', async function() {
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();

            if (!email && !phone) {
                showError('emailError', '请输入邮箱或手机号');
                return;
            }

            if (email && !validateEmail(email)) {
                showError('emailError', '邮箱格式不正确');
                return;
            }

            if (phone && !validatePhone(phone)) {
                showError('phoneError', '手机号格式不正确');
                return;
            }

            try {
                const response = await axios.post('/api/auth/send-verification-code', {
                    email: email || null,
                    phone: phone || null
                });

                if (response.data.success) {
                    verificationCodeSent = true;
                    showSuccess('验证码已发送');
                    startCodeCountdown();
                } else {
                    showErrorMessage(response.data.message || '发送验证码失败');
                }
            } catch (error) {
                if (error.response?.data?.message) {
                    showErrorMessage(error.response.data.message);
                } else {
                    showErrorMessage('网络错误，请稍后重试');
                }
            }
        });

        function startCodeCountdown() {
            codeCountdown = 60;
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = `${codeCountdown}秒后重试`;
            sendCodeBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const interval = setInterval(() => {
                codeCountdown--;
                sendCodeBtn.textContent = `${codeCountdown}秒后重试`;

                if (codeCountdown <= 0) {
                    clearInterval(interval);
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '发送验证码';
                    sendCodeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            clearAllErrors();

            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const verificationCode = verificationCodeInput.value.trim();
            const agreeTerms = agreeTermsCheckbox.checked;

            let isValid = true;

            if (!fullName) {
                showError('fullNameError', '请输入姓名或公司名称');
                isValid = false;
            }

            if (!email) {
                showError('emailError', '请输入邮箱地址');
                isValid = false;
            } else if (!validateEmail(email)) {
                showError('emailError', '邮箱格式不正确');
                isValid = false;
            }

            if (phone && !validatePhone(phone)) {
                showError('phoneError', '手机号格式不正确');
                isValid = false;
            }

            if (!password) {
                showError('passwordError', '请设置密码');
                isValid = false;
            } else if (!isPasswordStrong(password)) {
                showError('passwordError', '密码强度不足，请包含大小写字母、数字和特殊字符');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showError('confirmPasswordError', '两次输入的密码不一致');
                isValid = false;
            }

            if (!verificationCode) {
                showError('verificationCodeError', '请输入验证码');
                isValid = false;
            }

            if (!agreeTerms) {
                showError('agreeTermsError', '请同意服务条款和隐私政策');
                isValid = false;
            }

            if (!isValid) return;

            try {
                const response = await axios.post('/api/auth/register', {
                    fullName,
                    email,
                    phone: phone || null,
                    password,
                    verificationCode
                });

                if (response.data.success) {
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('successMessage').classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    showErrorMessage(response.data.message || '注册失败，请重试');
                }
            } catch (error) {
                if (error.response?.data?.message) {
                    showErrorMessage(error.response.data.message);
                } else {
                    showErrorMessage('网络错误，请稍后重试');
                }
            }
        });

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validatePhone(phone) {
            const phoneRegex = /^1[3-9]\d{9}$/;
            return phoneRegex.test(phone);
        }

        function isPasswordStrong(password) {
            return password.length >= 8 &&
                   /[A-Z]/.test(password) &&
                   /[0-9]/.test(password) &&
                   /[!@#$%^&*]/.test(password);
        }

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }

        function clearAllErrors() {
            document.querySelectorAll('[id$="Error"]').forEach(el => {
                el.classList.add('hidden');
                el.textContent = '';
            });
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function showErrorMessage(message) {
            const errorMessage = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function showSuccess(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
