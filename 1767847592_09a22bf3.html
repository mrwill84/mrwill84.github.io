<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智律云合同审核平台 - 合同管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-white shadow-lg">
            <div class="p-6 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-blue-600">智律云</h1>
                <p class="text-sm text-gray-500 mt-1">合同审核平台</p>
            </div>
            <nav class="p-4 space-y-2">
                <a href="#" class="block px-4 py-3 rounded-lg bg-blue-50 text-blue-600 font-medium">
                    <span class="inline-block mr-3">📋</span>合同管理
                </a>
                <a href="#" class="block px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100">
                    <span class="inline-block mr-3">✓</span>合同审核
                </a>
                <a href="#" class="block px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100">
                    <span class="inline-block mr-3">📤</span>外发签约
                </a>
                <a href="#" class="block px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100">
                    <span class="inline-block mr-3">🔐</span>权限管理
                </a>
                <a href="#" class="block px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100">
                    <span class="inline-block mr-3">👤</span>个人中心
                </a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1">
            <!-- 顶部栏 -->
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="px-8 py-4 flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-gray-800">合同管理</h2>
                    <div class="flex items-center space-x-4">
                        <button class="text-gray-600 hover:text-gray-900">
                            <span class="text-xl">🔔</span>
                        </button>
                        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">
                            用户
                        </div>
                    </div>
                </div>
            </header>

            <!-- 内容区 -->
            <div class="p-8">
                <!-- 操作栏 -->
                <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                    <div class="flex flex-wrap gap-4 mb-6">
                        <button id="createBtn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium flex items-center gap-2">
                            <span>➕</span>创建合同
                        </button>
                        <button id="importBtn" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium flex items-center gap-2">
                            <span>📥</span>导入
                        </button>
                        <button id="exportBtn" class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium flex items-center gap-2">
                            <span>📤</span>导出CSV
                        </button>
                        <button id="batchBtn" class="px-6 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 font-medium flex items-center gap-2">
                            <span>⚙️</span>批量操作
                        </button>
                    </div>

                    <!-- 筛选区 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">关键字搜索</label>
                            <input type="text" id="searchInput" placeholder="搜索合同编号、标题..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">签署状态</label>
                            <select id="statusFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">全部状态</option>
                                <option value="draft">草稿</option>
                                <option value="pending">待签署</option>
                                <option value="signed">已签署</option>
                                <option value="rejected">已拒绝</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">创建日期</label>
                            <input type="date" id="dateFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">金额范围</label>
                            <div class="flex gap-2">
                                <input type="number" id="amountMin" placeholder="最小" class="w-1/2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <input type="number" id="amountMax" placeholder="最大" class="w-1/2 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-4">
                        <button id="searchBtn" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-medium">
                            🔍 搜索
                        </button>
                        <button id="resetBtn" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 font-medium">
                            ↺ 重置
                        </button>
                    </div>
                </div>

                <!-- 合同列表 -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-100 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 text-left">
                                        <input type="checkbox" id="selectAll" class="w-4 h-4 rounded border-gray-300">
                                    </th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">合同编号</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">标题</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">甲方</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">签署状态</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">金额</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">更新日期</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">操作</th>
                                </tr>
                            </thead>
                            <tbody id="contractTable" class="divide-y divide-gray-200">
                                <!-- 动态生成的行 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 分页器 -->
                    <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                        <div class="text-sm text-gray-600">
                            显示 <span id="pageInfo">0</span> 条记录
                        </div>
                        <div class="flex gap-2">
                            <button id="prevBtn" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 font-medium">
                                ← 上一页
                            </button>
                            <div id="pageNumbers" class="flex gap-1">
                                <!-- 动态生成的页码 -->
                            </div>
                            <button id="nextBtn" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 font-medium">
                                下一页 →
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 创建合同模态框 -->
    <div id="createModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4">
            <div class="px-8 py-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800">创建新合同</h3>
                <button id="closeCreateModal" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>
            <div class="px-8 py-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">合同标题 *</label>
                    <input type="text" id="contractTitle" placeholder="输入合同标题" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">甲方 *</label>
                        <input type="text" id="partyA" placeholder="输入甲方名称" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">乙方 *</label>
                        <input type="text" id="partyB" placeholder="输入乙方名称" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">合同金额 *</label>
                        <input type="number" id="contractAmount" placeholder="输入金额" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">签署截止日期 *</label>
                        <input type="date" id="dueDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">上传合同文件</label>
                    <input type="file" id="contractFile" accept=".pdf,.doc,.docx" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>
            </div>
            <div class="px-8 py-6 border-t border-gray-200 flex justify-end gap-3">
                <button id="cancelCreateBtn" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium">
                    取消
                </button>
                <button id="submitCreateBtn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                    创建合同
                </button>
            </div>
        </div>
    </div>

    <!-- 快速查看模态框 -->
    <div id="viewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4">
            <div class="px-8 py-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800">合同详情</h3>
                <button id="closeViewModal" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>
            <div id="viewContent" class="px-8 py-6 space-y-4">
                <!-- 动态生成的内容 -->
            </div>
            <div class="px-8 py-6 border-t border-gray-200 flex justify-end gap-3">
                <button id="editBtn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                    编辑
                </button>
                <button id="closeViewBtn" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <!-- 批量操作模态框 -->
    <div id="batchModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="px-8 py-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800">批量操作</h3>
                <button id="closeBatchModal" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
            </div>
            <div class="px-8 py-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">选择操作</label>
                    <select id="batchAction" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">请选择操作</option>
                        <option value="export">导出选中合同</option>
                        <option value="status">变更状态</option>
                        <option value="delete">删除</option>
                    </select>
                </div>
                <div id="statusSelect" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-2">新状态</label>
                    <select id="newStatus" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="draft">草稿</option>
                        <option value="pending">待签署</option>
                        <option value="signed">已签署</option>
                    </select>
                </div>
            </div>
            <div class="px-8 py-6 border-t border-gray-200 flex justify-end gap-3">
                <button id="cancelBatchBtn" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium">
                    取消
                </button>
                <button id="confirmBatchBtn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                    确认操作
                </button>
            </div>
        </div>
    </div>

    <!-- 通知提示 -->
    <div id="notification" class="hidden fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50">
        <!-- 动态内容 -->
    </div>

    <script>
        // 数据管理
        let contracts = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let selectedContracts = new Set();
        let filteredContracts = [];

        // 初始化数据
        function initializeData() {
            contracts = [
                { id: 1, number: 'CT-2024-001', title: '服务合同', partyA: '甲方公司', status: 'signed', amount: 50000, date: '2024-01-15' },
                { id: 2, number: 'CT-2024-002', title: '采购合同', partyA: '乙方企业', status: 'pending', amount: 100000, date: '2024-01-16' },
                { id: 3, number: 'CT-2024-003', title: '租赁合同', partyA: '丙方集团', status: 'draft', amount: 75000, date: '2024-01-17' },
                { id: 4, number: 'CT-2024-004', title: '供应合同', partyA: '丁方有限公司', status: 'signed', amount: 200000, date: '2024-01-18' },
                { id: 5, number: 'CT-2024-005', title: '委托合同', partyA: '戊方机构', status: 'rejected', amount: 30000, date: '2024-01-19' },
                { id: 6, number: 'CT-2024-006', title: '合作合同', partyA: '己方公司', status: 'pending', amount: 150000, date: '2024-01-20' },
                { id: 7, number: 'CT-2024-007', title: '维护合同', partyA: '庚方企业', status: 'signed', amount: 60000, date: '2024-01-21' },
                { id: 8, number: 'CT-2024-008', title: '咨询合同', partyA: '辛方集团', status: 'draft', amount: 45000, date: '2024-01-22' },
                { id: 9, number: 'CT-2024-009', title: '代理合同', partyA: '壬方有限公司', status: 'pending', amount: 80000, date: '2024-01-23' },
                { id: 10, number: 'CT-2024-010', title: '转让合同', partyA: '癸方机构', status: 'signed', amount: 120000, date: '2024-01-24' },
                { id: 11, number: 'CT-2024-011', title: '许可合同', partyA: '甲方公司', status: 'pending', amount: 90000, date: '2024-01-25' },
                { id: 12, number: 'CT-2024-012', title: '保险合同', partyA: '乙方企业', status: 'signed', amount: 55000, date: '2024-01-26' }
            ];
            filteredContracts = [...contracts];
            renderTable();
        }

        // 渲染表格
        function renderTable() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredContracts.slice(start, end);
            const tbody = document.getElementById('contractTable');
            tbody.innerHTML = '';

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">暂无数据</td></tr>';
                return;
            }

            pageData.forEach(contract => {
                const statusMap = { 'draft': '草稿', 'pending': '待签署', 'signed': '已签署', 'rejected': '已拒绝' };
                const statusColors = { 'draft': 'gray', 'pending': 'yellow', 'signed': 'green', 'rejected': 'red' };
                const color = statusColors[contract.status];
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4">
                        <input type="checkbox" class="contract-checkbox w-4 h-4 rounded border-gray-300" data-id="${contract.id}">
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.number}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.title}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.partyA}</td>
                    <td class="px-6 py-4 text-sm">
                        <span class="px-3 py-1 rounded-full text-white text-xs font-medium bg-${color}-500">
                            ${statusMap[contract.status]}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">¥${contract.amount.toLocaleString()}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.date}</td>
                    <td class="px-6 py-4 text-sm">
                        <button class="text-blue-600 hover:text-blue-800 font-medium view-btn" data-id="${contract.id}">查看</button>
                        <span class="text-gray-300 mx-2">|</span>
                        <button class="text-red-600 hover:text-red-800 font-medium delete-btn" data-id="${contract.id}">删除</button>
                    </td>
                </tr>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('pageInfo').textContent = filteredContracts.length;
            renderPagination();
            attachEventListeners();
        }

        // 渲染分页
        function renderPagination() {
            const totalPages = Math.ceil(filteredContracts.length / itemsPerPage);
            const pageNumbers = document.getElementById('pageNumbers');
            pageNumbers.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `px-3 py-2 rounded-lg border ${i === currentPage ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-300 hover:bg-gray-50'}`;
                btn.onclick = () => {
                    currentPage = i;
                    renderTable();
                };
                pageNumbers.appendChild(btn);
            }

            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        // 附加事件监听
        function attachEventListeners() {
            document.querySelectorAll('.contract-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    if (e.target.checked) {
                        selectedContracts.add(id);
                    } else {
                        selectedContracts.delete(id);
                    }
                });
            });

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    const contract = contracts.find(c => c.id === id);
                    showViewModal(contract);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    if (confirm('确定要删除此合同吗？')) {
                        contracts = contracts.filter(c => c.id !== id);
                        filteredContracts = filteredContracts.filter(c => c.id !== id);
                        currentPage = 1;
                        renderTable();
                        showNotification('合同已删除');
                    }
                });
            });
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.remove('hidden');
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3000);
        }

        // 显示查看模态框
        function showViewModal(contract) {
            const viewContent = document.getElementById('viewContent');
            const statusMap = { 'draft': '草稿', 'pending': '待签署', 'signed': '已签署', 'rejected': '已拒绝' };
            viewContent.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-sm text-gray-600">合同编号</p>
                        <p class="text-lg font-semibold text-gray-900">${contract.number}</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">合同标题</p>
                        <p class="text-lg font-semibold text-gray-900">${contract.title}</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">甲方</p>
                        <p class="text-lg font-semibold text-gray-900">${contract.partyA}</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">签署状态</p>
                        <p class="text-lg font-semibold text-gray-900">${statusMap[contract.status]}</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">合同金额</p>
                        <p class="text-lg font-semibold text-gray-900">¥${contract.amount.toLocaleString()}</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-600">更新日期</p>
                        <p class="text-lg font-semibold text-gray-900">${contract.date}</p>
                    </div>
                </div>
            `;
            document.getElementById('viewModal').classList.remove('hidden');
        }

        // 搜索和筛选
        document.getElementById('searchBtn').addEventListener('click', () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const date = document.getElementById('dateFilter').value;
            const amountMin = parseFloat(document.getElementById('amountMin').value) || 0;
            const amountMax = parseFloat(document.getElementById('amountMax').value) || Infinity;

            filteredContracts = contracts.filter(contract => {
                const matchSearch = !search || contract.number.toLowerCase().includes(search) || contract.title.toLowerCase().includes(search);
                const matchStatus = !status || contract.status === status;
                const matchDate = !date || contract.date === date;
                const matchAmount = contract.amount >= amountMin && contract.amount <= amountMax;
                return matchSearch && matchStatus && matchDate && matchAmount;
            });

            currentPage = 1;
            renderTable();
            showNotification('搜索完成');
        });

        // 重置筛选
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('dateFilter').value = '';
            document.getElementById('amountMin').value = '';
            document.getElementById('amountMax').value = '';
            filteredContracts = [...contracts];
            currentPage = 1;
            renderTable();
        });

        // 创建合同
        document.getElementById('createBtn').addEventListener('click', () => {
            document.getElementById('createModal').classList.remove('hidden');
        });

        document.getElementById('closeCreateModal').addEventListener('click', () => {
            document.getElementById('createModal').classList.add('hidden');
        });

        document.getElementById('cancelCreateBtn').addEventListener('click', () => {
            document.getElementById('createModal').classList.add('hidden');
        });

        document.getElementById('submitCreateBtn').addEventListener('click', () => {
            const title = document.getElementById('contractTitle').value;
            const partyA = document.getElementById('partyA').value;
            const partyB = document.getElementById('partyB').value;
            const amount = parseFloat(document.getElementById('contractAmount').value);
            const dueDate = document.getElementById('dueDate').value;

            if (!title || !partyA || !partyB || !amount || !dueDate) {
                showNotification('请填写所有必填字段');
                return;
            }

            const newContract = {
                id: Math.max(...contracts.map(c => c.id), 0) + 1,
                number: `CT-2024-${String(Math.max(...contracts.map(c => c.id), 0) + 1).padStart(3, '0')}`,
                title: title,
                partyA: partyA,
                status: 'draft',
                amount: amount,
                date: new Date().toISOString().split('T')[0]
            };

            contracts.push(newContract);
            filteredContracts = [...contracts];
            currentPage = 1;
            renderTable();
            document.getElementById('createModal').classList.add('hidden');
            document.getElementById('contractTitle').value = '';
            document.getElementById('partyA').value = '';
            document.getElementById('partyB').value = '';
            document.getElementById('contractAmount').value = '';
            document.getElementById('dueDate').value = '';
            showNotification('合同创建成功');
        });

        // 查看模态框关闭
        document.getElementById('closeViewModal').addEventListener('click', () => {
            document.getElementById('viewModal').classList.add('hidden');
        });

        document.getElementById('closeViewBtn').addEventListener('click', () => {
            document.getElementById('viewModal').classList.add('hidden');
        });

        // 批量操作
        document.getElementById('batchBtn').addEventListener('click', () => {
            if (selectedContracts.size === 0) {
                showNotification('请先选择要操作的合同');
                return;
            }
            document.getElementById('batchModal').classList.remove('hidden');
        });

        document.getElementById('closeBatchModal').addEventListener('click', () => {
            document.getElementById('batchModal').classList.add('hidden');
        });

        document.getElementById('cancelBatchBtn').addEventListener('click', () => {
            document.getElementById('batchModal').classList.add('hidden');
        });

        document.getElementById('batchAction').addEventListener('change', (e) => {
            const statusSelect = document.getElementById('statusSelect');
            if (e.target.value === 'status') {
                statusSelect.classList.remove('hidden');
            } else {
                statusSelect.classList.add('hidden');
            }
        });

        document.getElementById('confirmBatchBtn').addEventListener('click', () => {
            const action = document.getElementById('batchAction').value;
            if (!action) {
                showNotification('请选择操作');
                return;
            }

            if (action === 'export') {
                const selectedData = contracts.filter(c => selectedContracts.has(c.id));
                const csv = 'data:text/csv;charset=utf-8,' + encodeURIComponent('合同编号,标题,甲方,状态,金额,日期\n' + selectedData.map(c => `${c.number},${c.title},${c.partyA},${c.status},${c.amount},${c.date}`).join('\n'));
                const link = document.createElement('a');
                link.setAttribute('href', csv);
                link.setAttribute('download', 'contracts.csv');
                link.click();
                showNotification('导出成功');
            } else if (action === 'status') {
                const newStatus = document.getElementById('newStatus').value;
                selectedContracts.forEach(id => {
                    const contract = contracts.find(c => c.id === id);
                    if (contract) contract.status = newStatus;
                });
                filteredContracts = [...contracts];
                renderTable();
                showNotification('状态更新成功');
            } else if (action === 'delete') {
                contracts = contracts.filter(c => !selectedContracts.has(c.id));
                filteredContracts = [...contracts];
                selectedContracts.clear();
                currentPage = 1;
                renderTable();
                showNotification('删除成功');
            }

            document.getElementById('batchModal').classList.add('hidden');
            document.getElementById('batchAction').value = '';
        });

        // 导出按钮
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (filteredContracts.length === 0) {
                showNotification('没有可导出的数据');
                return;
            }
            const csv = 'data:text/csv;charset=utf-8,' + encodeURIComponent('合同编号,标题,甲方,状态,金额,日期\n' + filteredContracts.map(c => `${c.number},${c.title},${c.partyA},${c.status},${c.amount},${c.date}`).join('\n'));
            const link = document.createElement('a');
            link.setAttribute('href', csv);
            link.setAttribute('download', 'all_contracts.csv');
            link.click();
            showNotification('导出成功');
        });

        // 导入按钮
        document.getElementById('importBtn').addEventListener('click', () => {
            showNotification('导入功能已触发');
        });

        // 分页按钮
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredContracts.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });

        // 全选复选框
        document.getElementById('selectAll').addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.contract-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = e.target.checked;
                const id = parseInt(checkbox.dataset.id);
                if (e.target.checked) {
                    selectedContracts.add(id);
                } else {
                    selectedContracts.delete(id);
                }
            });
        });

        // 初始化
        initializeData();
    </script>
</body>
</html>
