    <script>
        const navTabs = document.querySelectorAll('.nav-tab');
        const tabContents = document.querySelectorAll('.tab-content');

        navTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.getAttribute('data-tab');
                switchTab(tabName);
            });
        });

        function switchTab(tabName) {
            navTabs.forEach(tab => tab.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));

            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(`${tabName}Tab`).classList.add('active');
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.803m5.596-3.856a3.375 3.375 0 11-4.753 4.753m4.753-4.753L3.596 3.596"></path>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            }
        }

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validatePhone(phone) {
            const phoneRegex = /^1[3-9]\d{9}$/;
            return phoneRegex.test(phone);
        }

        function validatePassword(password) {
            return password.length >= 8 && /[a-z]/.test(password) && /[A-Z]/.test(password) && /\d/.test(password);
        }

        function validateUsername(username) {
            return validateEmail(username) || validatePhone(username) || /^\d{6,}$/.test(username);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const loginMessage = document.getElementById('loginMessage');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginSpinner = document.getElementById('loginSpinner');

            usernameError.textContent = '';
            passwordError.textContent = '';
            loginMessage.textContent = '';

            if (!validateUsername(username)) {
                usernameError.textContent = '请输入有效的邮箱、手机号或工号';
                return;
            }

            if (password.length < 8) {
                passwordError.textContent = '密码至少需要8位';
                return;
            }

            loginBtn.disabled = true;
            loginBtnText.style.display = 'none';
            loginSpinner.style.display = 'inline-block';

            try {
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                const loginContainer = document.querySelector('.login-container');
                const mfaContainer = document.getElementById('mfaContainer');
                
                loginContainer.classList.add('hidden');
                mfaContainer.classList.add('active');
                
                setupOTPInputs();
            } catch (error) {
                loginMessage.innerHTML = '<div class="error-message">登录失败，请重试</div>';
            } finally {
                loginBtn.disabled = false;
                loginBtnText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        });

        function setupOTPInputs() {
            const otpInputs = document.querySelectorAll('.otp-input');
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
            });
        }

        function verifyMFA() {
            const otpInputs = document.querySelectorAll('.otp-input');
            const otp = Array.from(otpInputs).map(input => input.value).join('');
            const mfaError = document.getElementById('mfaError');
            const mfaSuccess = document.getElementById('mfaSuccess');

            mfaError.textContent = '';
            mfaSuccess.textContent = '';

            if (otp.length !== 6) {
                mfaError.textContent = '请输入完整的6位验证码';
                return;
            }

            mfaSuccess.textContent = '验证成功，正在跳转...';
            setTimeout(() => {
                alert('登录成功！正在跳转到仪表盘...');
                location.reload();
            }, 1500);
        }

        function backToLogin() {
            const loginContainer = document.querySelector('.login-container');
            const mfaContainer = document.getElementById('mfaContainer');
            
            loginContainer.classList.remove('hidden');
            mfaContainer.classList.remove('active');
            
            document.querySelectorAll('.otp-input').forEach(input => input.value = '');
        }

        function handleSSO(provider) {
            alert(`正在跳转到${provider === 'wechat' ? '企业微信' : '钉钉'}登录...`);
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const captcha = document.getElementById('regCaptcha').value.trim();
            const agreeTerms = document.getElementById('agreeTerms').checked;

            const emailError = document.getElementById('regEmailError');
            const phoneError = document.getElementById('regPhoneError');
            const passwordError = document.getElementById('regPasswordError');
            const passwordConfirmError = document.getElementById('regPasswordConfirmError');
            const captchaError = document.getElementById('regCaptchaError');
            const registerMessage = document.getElementById('registerMessage');
            const registerBtn = document.getElementById('registerBtn');
            const registerBtnText = document.getElementById('registerBtnText');
            const registerSpinner = document.getElementById('registerSpinner');

            emailError.textContent = '';
            phoneError.textContent = '';
            passwordError.textContent = '';
            passwordConfirmError.textContent = '';
            captchaError.textContent = '';
            registerMessage.textContent = '';

            let hasError = false;

            if (!validateEmail(email)) {
                emailError.textContent = '请输入有效的邮箱地址';
                hasError = true;
            }

            if (!validatePhone(phone)) {
                phoneError.textContent = '请输入有效的手机号';
                hasError = true;
            }

            if (!validatePassword(password)) {
                passwordError.textContent = '密码需至少8位，包含大小写字母、数字';
                hasError = true;
            }

            if (password !== passwordConfirm) {
                passwordConfirmError.textContent = '两次输入的密码不一致';
                hasError = true;
            }

            if (captcha.length !== 6) {
                captchaError.textContent = '请输入6位验证码';
                hasError = true;
            }

            if (!agreeTerms) {
                registerMessage.innerHTML = '<div class="error-message">请同意用户协议和隐私政策</div>';
                hasError = true;
            }

            if (hasError) return;

            registerBtn.disabled = true;
            registerBtnText.style.display = 'none';
            registerSpinner.style.display = 'inline-block';

            try {
                await new Promise(resolve => setTimeout(resolve, 1500));
                registerMessage.innerHTML = '<div class="success-message">注册成功！请登录</div>';
                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('registerForm').reset();
                }, 2000);
            } catch (error) {
                registerMessage.innerHTML = '<div class="error-message">注册失败，请重试</div>';
            } finally {
                registerBtn.disabled = false;
                registerBtnText.style.display = 'inline';
                registerSpinner.style.display = 'none';
            }
        });

        function sendCaptcha() {
            const email = document.getElementById('regEmail').value.trim();
            const captchaError = document.getElementById('regCaptchaError');
            
            captchaError.textContent = '';

            if (!validateEmail(email)) {
                captchaError.textContent = '请先输入有效的邮箱地址';
                return;
            }

            alert('验证码已发送至 ' + email);
        }

        document.getElementById('languageSelect').addEventListener('change', (e) => {
            const lang = e.target.value;
            alert(`语言已切换为${lang === 'zh' ? '中文' : 'English'}`);
        });
    </script>
</body>
