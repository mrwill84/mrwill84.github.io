```html
<!doctype html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm border-b border-gray-200">

                            <button onclick="switchPage('external')" class="nav-btn text-gray-700 hover:text-blue-600 font-medium">合同外发</button>
                            <button onclick="switchPage('signing')" class="nav-btn text-gray-700 hover:text-blue-600 font-medium">合同签约</button>
                            <button onclick="switchPage('management')" class="nav-btn text-blue-600 font-medium border-b-2 border-blue-600">合同管理</button>

                    </div>

                        </button>

                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Contract Management Page -->
            <div id="management-page" class="space-y-6">
                <!-- Header Section -->
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold text-gray-900">合同管理</h1>
                    <div class="flex space-x-3">
                        <button onclick="openCreateModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2">
                            <i class="fas fa-plus"></i>
                            <span>新建合同</span>
                        </button>
                        <button onclick="openImportModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2">
                            <i class="fas fa-upload"></i>
                            <span>批量导入</span>
                        </button>
                        <button onclick="exportContracts()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2">
                            <i class="fas fa-download"></i>
                            <span>导出</span>
                        </button>
                    </div>
                </div>

                <!-- Search and Filter Section -->
                <div class="bg-white rounded-lg shadow-sm p-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <input type="text" id="searchInput" placeholder="搜索合同号/客户名..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600" onkeyup="filterContracts()">
                        </div>
                        <div>
                            <select id="statusFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600" onchange="filterContracts()">
                                <option value="">全部状态</option>
                                <option value="draft">草稿</option>
                                <option value="pending">待审批</option>
                                <option value="approved">已批准</option>
                                <option value="signed">已签约</option>
                                <option value="completed">已完成</option>
                            </select>
                        </div>
                        <div>
                            <input type="date" id="dateFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600" onchange="filterContracts()">
                        </div>
                        <div>
                            <select id="ownerFilter" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600" onchange="filterContracts()">
                                <option value="">全部负责人</option>
                                <option value="user1">张三</option>
                                <option value="user2">李四</option>
                                <option value="user3">王五</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Batch Operations -->
                <div id="batchOpsSection" class="bg-blue-50 rounded-lg p-4 hidden">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-700">已选择 <span id="selectedCount">0</span> 项</span>
                        <div class="flex space-x-2">
                            <button onclick="changeBatchStatus()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm font-medium">变更状态</button>
                            <button onclick="batchExport()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm font-medium">批量导出</button>
                            <button onclick="batchDelete()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm font-medium">删除</button>
                        </div>
                    </div>
                </div>

                <!-- Contract List -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-100 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left">
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" class="w-4 h-4 cursor-pointer">
                                </th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">合同号</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">客户名称</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">金额</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">状态</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">负责人</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">创建时间</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">操作</th>
                            </tr>
                        </thead>
                        <tbody id="contractList" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="flex justify-center items-center space-x-2">
                    <button onclick="previousPage()" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100">上一页</button>
                    <span id="pageInfo" class="text-gray-700">第 1 页</span>
                    <button onclick="nextPage()" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Contract Modal -->
    <div id="createModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-900">新建合同</h2>
                <button onclick="closeCreateModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">合同号 <span class="text-red-600">*</span></label>
                    <input type="text" id="contractNo" placeholder="输入合同号" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">客户名称 <span class="text-red-600">*</span></label>
                    <input type="text" id="customerName" placeholder="输入客户名称" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">合同金额 <span class="text-red-600">*</span></label>
                    <input type="number" id="contractAmount" placeholder="输入金额" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">合同日期 <span class="text-red-600">*</span></label>
                    <input type="date" id="contractDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">选择模板</label>
                    <select id="templateSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                        <option value="">无模板</option>
                        <option value="template1">标准采购合同</option>
                        <option value="template2">服务合同</option>
                        <option value="template3">保密协议</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">上传附件</label>
                    <input type="file" id="attachmentFile" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button onclick="saveDraft()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium">保存草稿</button>
                    <button onclick="submitForApproval()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">提交审批</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4">
            <div class="border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-900">批量导入合同</h2>
                <button onclick="closeImportModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <p class="text-sm text-blue-800">支持格式: Excel (.xlsx), CSV (.csv) | 最大文件大小: 10MB</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">选择文件 <span class="text-red-600">*</span></label>
                    <input type="file" id="importFile" accept=".xlsx,.csv" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                </div>
                <div id="importResult" class="hidden bg-gray-50 rounded-lg p-4 max-h-48 overflow-y-auto">
                    <h3 class="font-semibold text-gray-900 mb-2">导入结果</h3>
                    <div id="resultContent" class="text-sm text-gray-700 space-y-1"></div>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button onclick="closeImportModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded-lg font-medium">取消</button>
                    <button onclick="confirmImport()" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium">确认导入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Version History Modal -->
    <div id="versionModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-900">版本历史</h2>
                <button onclick="closeVersionModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="versionList" class="p-6 space-y-3">
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg max-w-md w-full mx-4">
            <div class="border-b border-gray-200 px-6 py-4">
                <h2 class="text-lg font-bold text-gray-900">确认操作</h2>
            </div>
            <div class="p-6">
                <p id="confirmMessage" class="text-gray-700 mb-6"></p>
                <div class="flex space-x-3">
                    <button onclick="cancelConfirm()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded-lg font-medium">取消</button>
                    <button onclick="executeConfirm()" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium">确认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Change Modal -->
    <div id="statusModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-lg max-w-md w-full mx-4">
            <div class="border-b border-gray-200 px-6 py-4">
                <h2 class="text-lg font-bold text-gray-900">变更状态</h2>
            </div>
            <div class="p-6 space-y-4">
                <select id="newStatus" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                    <option value="">选择新状态</option>
                    <option value="pending">待审批</option>
                    <option value="approved">已批准</option>
                    <option value="signed">已签约</option>
                    <option value="completed">已完成</option>
                </select>
                <div class="flex space-x-3">
                    <button onclick="closeStatusModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded-lg font-medium">取消</button>
                    <button onclick="confirmStatusChange()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let selectedContracts = new Set();
        let pendingOperation = null;
        let contractsData = [];

        function initializeContracts() {
            contractsData = [
                { id: 1, no: 'CT-2024-001', customer: '客户A', amount: 50000, status: 'draft', owner: '张三', date: '2024-01-15' },
                { id: 2, no: 'CT-2024-002', customer: '客户B', amount: 100000, status: 'pending', owner: '李四', date: '2024-01-16' },
                { id: 3, no: 'CT-2024-003', customer: '客户C', amount: 75000, status: 'approved', owner: '王五', date: '2024-01-17' },
                { id: 4, no: 'CT-2024-004', customer: '客户D', amount: 120000, status: 'signed', owner: '张三', date: '2024-01-18' },
                { id: 5, no: 'CT-2024-005', customer: '客户E', amount: 90000, status: 'completed', owner: '李四', date: '2024-01-19' },
            ];
            renderContracts();
        }

        function renderContracts() {
            const list = document.getElementById('contractList');
            list.innerHTML = '';
            contractsData.forEach(contract => {
                const statusMap = { draft: '草稿', pending: '待审批', approved: '已批准', signed: '已签约', completed: '已完成' };
                const statusColors = { draft: 'gray', pending: 'yellow', approved: 'green', signed: 'blue', completed: 'green' };
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4"><input type="checkbox" class="contract-checkbox w-4 h-4 cursor-pointer" value="${contract.id}" onchange="updateSelection()"></td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.no}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.customer}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">¥${contract.amount.toLocaleString()}</td>
                    <td class="px-6 py-4 text-sm"><span class="px-3 py-1 rounded-full text-white text-xs font-medium bg-${statusColors[contract.status]}-500">${statusMap[contract.status]}</span></td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.owner}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${contract.date}</td>
                    <td class="px-6 py-4 text-sm space-x-2">
                        <button onclick="viewVersions(${contract.id})" class="text-blue-600 hover:text-blue-800 font-medium">版本</button>
                        <button onclick="editContract(${contract.id})" class="text-blue-600 hover:text-blue-800 font-medium">编辑</button>
                        <button onclick="deleteContract(${contract.id})" class="text-red-600 hover:text-red-800 font-medium">删除</button>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        function updateSelection() {
            selectedContracts.clear();
            document.querySelectorAll('.contract-checkbox:checked').forEach(cb => {
                selectedContracts.add(parseInt(cb.value));
            });
            const batchOps = document.getElementById('batchOpsSection');
            if (selectedContracts.size > 0) {
                batchOps.classList.remove('hidden');
                document.getElementById('selectedCount').textContent = selectedContracts.size;
            } else {
                batchOps.classList.add('hidden');
            }
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.contract-checkbox').forEach(cb => {
                cb.checked = isChecked;
            });
            updateSelection();
        }

        function filterContracts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const date = document.getElementById('dateFilter').value;
            const owner = document.getElementById('ownerFilter').value;

            const filtered = contractsData.filter(c => {
                return (c.no.toLowerCase().includes(search) || c.customer.toLowerCase().includes(search)) &&
                       (!status || c.status === status) &&
                       (!date || c.date === date) &&
                       (!owner || c.owner === owner);
            });

            contractsData = filtered.length > 0 ? filtered : contractsData;
            renderContracts();
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.add('hidden');
            document.getElementById('contractNo').value = '';
            document.getElementById('customerName').value = '';
            document.getElementById('contractAmount').value = '';
            document.getElementById('contractDate').value = '';
        }

        function saveDraft() {
            const no = document.getElementById('contractNo').value;
            const customer = document.getElementById('customerName').value;
            const amount = document.getElementById('contractAmount').value;
            if (!no || !customer || !amount) {
                alert('请填写必填字段');
                return;
            }
            alert('草稿已保存');
            closeCreateModal();
        }

        function submitForApproval() {
            const no = document.getElementById('contractNo').value;
            const customer = document.getElementById('customerName').value;
            const amount = document.getElementById('contractAmount').value;
            if (!no || !customer || !amount) {
                alert('请填写必填字段');
                return;
            }
            alert('合同已提交审批');
            closeCreateModal();
        }

        function openImportModal() {
            document.getElementById('importModal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
            document.getElementById('importFile').value = '';
            document.getElementById('importResult').classList.add('hidden');
        }

        function confirmImport() {
            const file = document.getElementById('importFile').files[0];
            if (!file) {
                alert('请选择文件');
                return;
            }
            const resultDiv = document.getElementById('importResult');
            const content = document.getElementById('resultContent');
            content.innerHTML = '<p class="text-green-600">✓ 文件验证成功</p><p>✓ 5条记录导入成功</p><p>✓ 0条记录失败</p>';
            resultDiv.classList.remove('hidden');
            setTimeout(() => {
                alert('导入完成');
                closeImportModal();
            }, 1500);
        }

        function exportContracts() {
            alert('合同已导出为 contracts_' + new Date().getTime() + '.xlsx');
        }

        function batchExport() {
            if (selectedContracts.size === 0) {
                alert('请选择要导出的合同');
                return;
            }
            alert('已选择 ' + selectedContracts.size + ' 份合同导出');
        }

        function changeBatchStatus() {
            if (selectedContracts.size === 0) {
                alert('请选择要变更的合同');
                return;
            }
            document.getElementById('statusModal').classList.remove('hidden');
        }

        function closeStatusModal() {
            document.getElementById('statusModal').classList.add('hidden');
        }

        function confirmStatusChange() {
            const newStatus = document.getElementById('newStatus').value;
            if (!newStatus) {
                alert('请选择新状态');
                return;
            }
            alert('已变更 ' + selectedContracts.size + ' 份合同状态');
            closeStatusModal();
            selectedContracts.clear();
            updateSelection();
        }

        function batchDelete() {
            if (selectedContracts.size === 0) {
                alert('请选择要删除的合同');
                return;
            }
            document.getElementById('confirmMessage').textContent = '确定要删除选中的 ' + selectedContracts.size + ' 份合同吗？此操作不可撤销。';
            document.getElementById('confirmModal').classList.remove('hidden');
            pendingOperation = 'delete';
        }

        function cancelConfirm() {
            document.getElementById('confirmModal').classList.add('hidden');
            pendingOperation = null;
        }

        function executeConfirm() {
            if (pendingOperation === 'delete') {
                alert('已删除 ' + selectedContracts.size + ' 份合同');
                selectedContracts.clear();
                updateSelection();
            }
            document.getElementById('confirmModal').classList.add('hidden');
            pendingOperation = null;
        }

        function viewVersions(contractId) {
            const versions = [
                { version: 'v1.0', date: '2024-01-15 10:00', author: '张三', changes: '初始版本' },
                { version: 'v1.1', date: '2024-01-16 14:30', author: '李四', changes: '修改金额条款' },
                { version: 'v1.2', date: '2024-01-17 09:15', author: '王五', changes: '更新付款条件' },
            ];
            const versionList = document.getElementById('versionList');
            versionList.innerHTML = '';
            versions.forEach((v, idx) => {
                const div = document.createElement('div');
                div.className = 'border border-gray-200 rounded-lg p-4 flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-semibold text-gray-900">${v.version}</p>
                        <p class="text-sm text-gray-600">${v.date} | ${v.author}</p>
                        <p class="text-sm text-gray-700 mt-1">${v.changes}</p>
                    </div>
                    <div class="flex space-x-2">

                versionList.appendChild(div);

            document.getElementById('pageInfo').textContent = '第 ' + currentPage + ' 页';
