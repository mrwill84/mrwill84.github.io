<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智律云AI平台 v1.0</title>
<style>
  /* 全局样式 */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;

  header {
    background-color: #2d8cf0;

    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;

  header h1 {
    font-size: 24px;

  /* 导航菜单 */
  nav {
    display: flex;
    gap: 20px;

  nav a {

    padding: 8px 12px;
    border-radius: 4px;
    transition: background-color 0.3s;
  }

  nav a:hover {
    background-color: rgba(255,255,255,0.2);
  }

  /* 主内容区 */
.main {
  padding: 30px;
  max-width: 1200px;
  margin: 0 auto;
}

/* 模块标题 */
.section-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #333;
  border-bottom: 2px solid #e0e0e0;
  padding-bottom: 8px;
}

/* 文件上传区域 */
.upload-area {
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 40px;
  text-align: center;
  background-color: #fff;
  cursor: pointer;
  transition: border-color 0.3s, background-color 0.3s;
  position: relative;
  overflow: hidden;
}

.upload-area:hover {
  border-color: #2d8cf0;
  background-color: #f0f9ff;
}

.upload-area input[type="file"] {
  display: none;
}

.upload-icon {
  font-size: 48px;
  color: #2d8cf0;
  margin-bottom: 16px;
}

.upload-text {
  font-size: 16px;
  color: #666;
}

.drag-over {
  border-color: #1e90ff;
  background-color: #f0f8ff;
}

/* 导入按钮 */
.import-buttons {
  margin-top: 20px;
  display: flex;
  gap: 15px;
  justify-content: center;
}

.import-btn {
  background-color: #2d8cf0;
  color: #fff;
  padding: 10px 20px;
  border-radius: 4px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.3s;
}

.import-btn:hover {
  background-color: #1e6fcf;
}

/* 合同元数据表格 */
.metadata-section {
  margin-top: 40px;
  background-color: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.metadata-table {
  width: 100%;
  border-collapse: collapse;
}

.metadata-table th, .metadata-table td {
  padding: 12px 15px;
  border-bottom: 1px solid #e0e0e0;
  text-align: left;
  font-size: 14px;
}

.metadata-table th {
  width: 20%;
  font-weight: 600;
  color: #555;
}

.metadata-table td {
  position: relative;
}

.editable {
  padding: 6px 8px;
  border-radius: 4px;
  transition: background-color 0.2s;
}

.editable:hover {
  background-color: #f5f5f5;
}

.input-edit {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 14px;
}

.highlight-error {
  background-color: #ffe6e6;
  border-color: #ff4d4f;
  position: relative;
}

.highlight-error::after {
  content: '错误';
  position: absolute;
  top: 4px;
  right: 8px;
  font-size: 12px;
  color: #ff4d4f;
  font-weight: 600;
}

/* OCR处理区域 */
.ocr-section {
  margin-top: 40px;
  background-color: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.ocr-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.ocr-title {
  font-size: 20px;
  font-weight: 600;
  color: #333;
}

.ocr-actions {
  display: flex;
  gap: 10px;
}

.ocr-btn {
  background-color: #2d8cf0;
  color: #fff;
  padding: 8px 16px;
  border-radius: 4px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.3s;
  font-size: 14px;
}

.ocr-btn:hover {
  background-color: #1e6fcf;
}

/* OCR结果显示 */
.ocr-result {
  display: flex;
  flex-direction: column;
  gap: 15px;
  max-height: 300px;
  overflow-y: auto;
  padding: 10px;
  background-color: #fafafa;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
}

.ocr-field {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ocr-label {
  width: 150px;
  font-weight: 600;
  color: #555;
}

.ocr-input {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 14px;
  transition: border-color 0.2s;
}

.ocr-input:focus {
  border-color: #2d8cf0;
  outline: none;
}

.ocr-highlight {
  background-color: #fff3cd;
  border: 1px solid #ffeeba;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 13px;
  color: #856404;
}

/* 底部操作按钮 */
.footer-actions {
  margin-top: 40px;
  display: flex;
  justify-content: flex-end;
  gap: 15px;
}

.btn-primary {
  background-color: #2d8cf0;
  color: #fff;
  padding: 12px 24px;
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.3s;
  font-size: 14px;
}

.btn-primary:hover {
  background-color: #1e6fcf;
}

.btn-secondary {
  background-color: #ccc;
  color: #333;
  padding: 12px 24px;
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.3s;
  font-size: 14px;
}

.btn-secondary:hover {
  background-color: #999;
}

/* 响应式调整 */
@media(max-width: 768px) {
  header {
    flex-direction: column;
    align-items: flex-start;
  }

  nav {
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .footer-actions {
    flex-direction: column;
    align-items: stretch;
  }

  .import-buttons {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<header>
  <h1>智律云AI平台 v1.0</h1>
  <nav>
    <a href="#">首页</a>
    <a href="#">合同管理</a>
    <a href="#">智能解析</a>
    <a href="#">设置</a>
  </nav>
</header>

<div class="main">

  <!-- 合同上传区域 -->
  <section class="upload-section">
    <div class="section-title">合同上传与导入</div>
    <div id="uploadArea" class="upload-area">
      <div class="upload-icon">📁</div>
      <div class="upload-text">拖拽合同文件到此处，或点击上传</div>
      <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.jpg,.png"/>
    </div>
    <div class="import-buttons">
      <button class="import-btn" id="selectFilesBtn">选择文件</button>
      <button class="import-btn" id="importEmailBtn">导入邮件</button>
      <button class="import-btn" id="importCloudBtn">导入云存储</button>
    </div>
  </section>

  <!-- 合同元数据解析区域 -->
  <section class="metadata-section" id="metadataSection" style="display:none;">
    <div class="section-title">合同元数据</div>
    <table class="metadata-table" id="metadataTable">
      <thead>
        <tr>
          <th>字段</th>
          <th>内容</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>合同编号</th>
          <td class="editable" data-field="contractNumber" contenteditable="true">未解析</td>
        </tr>
        <tr>
          <th>对方主体</th>
          <td class="editable" data-field="counterparty" contenteditable="true">未解析</td>
        </tr>
        <tr>
          <th>签署日期</th>
          <td class="editable" data-field="signDate" contenteditable="true">未解析</td>
        </tr>
        <tr>
          <th>有效期</th>
          <td class="editable" data-field="validity" contenteditable="true">未解析</td>
        </tr>
        <tr>
          <th>金额</th>
          <td class="editable" data-field="amount" contenteditable="true">未解析</td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- OCR处理区域 -->
  <section class="ocr-section" id="ocrSection" style="display:none;">
    <div class="ocr-header">
      <div class="ocr-title">扫描件OCR处理</div>
      <div class="ocr-actions">
        <button class="ocr-btn" id="startOcrBtn">开始OCR</button>
        <button class="ocr-btn" id="saveOcrBtn">保存修正</button>
      </div>
    </div>
    <div class="ocr-result" id="ocrResultContainer">
      <!-- OCR字段会动态生成 -->
    </div>
  </section>

  <!-- 底部操作按钮 -->
  <div class="footer-actions">
    <button class="btn-secondary" id="cancelBtn">取消</button>
    <button class="btn-primary" id="saveBtn">保存合同</button>
  </div>

</div>

<script>
  // 文件拖拽逻辑
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('drag-over');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('drag-over');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    handleFiles(files);
  });

  document.getElementById('selectFilesBtn').addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    handleFiles(fileInput.files);
  });

  function handleFiles(files) {
    if (files.length > 0) {
      alert(`已选择 ${files.length} 个文件，准备上传`);
      // 这里可以添加文件预览或上传逻辑
      // 模拟解析合同
      showMetadataSection();
      populateMetadata({
        contractNumber: '合同编号123456',
        counterparty: '某某公司',
        signDate: '2023-01-15',
        validity: '2024-01-15',
        amount: '¥1,000,000'
      });
      showOcrSection();
      generateOcrFields([
        { label: '合同编号', value: '合同编号123456', confidence: 0.95 },
        { label: '对方主体', value: '某某公司', confidence: 0.80 },
        { label: '签署日期', value: '2023-01-15', confidence: 0.60 },
        { label: '有效期', value: '2024-01-15', confidence: 0.85 },
        { label: '金额', value: '¥1,000,000', confidence: 0.90 }
      ]);
    }
  }

  function showMetadataSection() {
    document.getElementById('metadataSection').style.display = 'block';
  }

  function showOcrSection() {
    document.getElementById('ocrSection').style.display = 'block';
  }

  function populateMetadata(data) {
    const tbody = document.getElementById('metadataTable').querySelector('tbody');
    const fields = ['contractNumber', 'counterparty', 'signDate', 'validity', 'amount'];
    fields.forEach(field => {
      const cell = tbody.querySelector(`td[data-field="${field}"]`);
      if (cell) {
        cell.textContent = data[field] || '未解析';
        removeHighlight(cell);
      }
    });
  }

  function generateOcrFields(fields) {
    const container = document.getElementById('ocrResultContainer');
    container.innerHTML = '';
    fields.forEach(field => {
      const div = document.createElement('div');
      div.className = 'ocr-field';

      const label = document.createElement('div');
      label.className = 'ocr-label';
      label.textContent = field.label;

      const input = document.createElement('input');
      input.className = 'ocr-input';
      input.type = 'text';
      input.value = field.value;
      input.setAttribute('data-confidence', field.confidence);
      input.setAttribute('data-label', field.label);
      input.addEventListener('focus', () => {
        removeHighlight(input);
      });

      // 高亮低置信度字段
      if (field.confidence < 0.75) {
        addHighlight(input);
      }

      div.appendChild(label);
      div.appendChild(input);
      container.appendChild(div);
    });
  }

  function addHighlight(element) {
    element.classList.add('highlight-error');
  }

  function removeHighlight(element) {
    element.classList.remove('highlight-error');
  }

  // OCR开始按钮
  document.getElementById('startOcrBtn').addEventListener('click', () => {
    alert('开始OCR识别...');
    // 这里可以调用OCR API
  });

  // 保存修正按钮
  document.getElementById('saveOcrBtn').addEventListener('click', () => {
    alert('已保存OCR修正内容');
    // 这里可以保存用户修正的内容
  });

  // 取消按钮
  document.getElementById('cancelBtn').addEventListener('click', () => {
    if (confirm('确认要取消当前操作吗？')) {
      // 重置界面
      document.getElementById('metadataSection').style.display = 'none';
      document.getElementById('ocrSection').style.display = 'none';
      document.querySelector('.footer-actions').style.display = 'none';
      alert('已取消操作');
    }
  });

  // 保存合同
  document.getElementById('saveBtn').addEventListener('click', () => {
    // 收集数据
    const metadata = {};
    const tbody = document.getElementById('metadataTable').querySelector('tbody');
    tbody.querySelectorAll('td').forEach(td => {
      const field = td.getAttribute('data-field');
      metadata[field] = td.textContent.trim();
    });

    const ocrInputs = document.querySelectorAll('.ocr-input');
    const ocrData = [];
    ocrInputs.forEach(input => {
      ocrData.push({
        label: input.getAttribute('data-label'),
        value: input.value.trim(),
        confidence: parseFloat(input.getAttribute('data-confidence'))
      });
    });

    alert('合同已保存！\n元数据：' + JSON.stringify(metadata) + '\nOCR数据：' + JSON.stringify(ocrData));
    // 这里可以提交数据到后台
  });
</script>
</body>
</html>
