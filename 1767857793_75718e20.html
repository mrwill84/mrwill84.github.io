<body>
    <div class="login-container">
        <div class="logo-section">

        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="login">登录</button>
            <button class="tab-btn" data-tab="register">注册</button>
        </div>
        
        <div id="login" class="tab-content active">
            <div class="success-message" id="loginSuccess">
                <i class="bi bi-check-circle"></i> 登录成功，正在跳转...
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名/邮箱/手机</label>
                    <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名、邮箱或手机号" required>
                    <div class="error-message" id="usernameError"></div>
                </div>
                
                <div id="passwordLoginSection">
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required>
                        <div class="error-message" id="passwordError"></div>
                    </div>
                </div>
                
                <div id="smsLoginSection" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">验证码</label>
                        <div class="input-group-wrapper">
                            <input type="text" class="form-input" id="smsCode" placeholder="请输入6位验证码" maxlength="6">
                            <span class="input-suffix" id="sendCodeBtn" onclick="sendSmsCode()">发送验证码</span>
                        </div>
                        <div class="error-message" id="smsCodeError"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">图形验证码</label>
                    <div class="input-group-wrapper">
                        <input type="text" class="form-input" id="captcha" placeholder="请输入验证码" maxlength="4" style="padding-right: 100px;">
                        <div style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #f0f0f0; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; user-select: none;" onclick="refreshCaptcha()">
                            <span id="captchaText">刷新</span>
                        </div>
                    </div>
                    <div class="error-message" id="captchaError"></div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" class="checkbox-input" id="rememberMe">
                    <label class="checkbox-label" for="rememberMe">记住我</label>
                </div>
                
                <div class="forgot-password">
                    <a href="#" onclick="showForgotPassword(event)">忘记密码？</a>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">登录</button>
            </form>
            
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">或使用</div>
                <div class="divider-line"></div>
            </div>
            
            <div class="sso-buttons">
                <button class="sso-btn" onclick="loginWithSSO('wechat')">
                    <i class="bi bi-chat-dots"></i> 微信
                </button>
                <button class="sso-btn" onclick="loginWithSSO('alipay')">
                    <i class="bi bi-wallet2"></i> 支付宝
                </button>
                <button class="sso-btn" onclick="loginWithSSO('dingtalk')">

                </button>

            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button type="button" class="login-btn" style="background: #f0f0f0; color: #333; flex: 1; margin-bottom: 0;" onclick="switchLoginMethod()">
                    <span id="switchMethodText">使用短信登录</span>
                </button>
            </div>
            
            <div class="footer-text">

        <div id="register" class="tab-content">
            <form id="registerForm">
                <div class="form-group">

                    <div class="error-message" id="phoneError"></div>

                <div class="form-group">

                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>

                <div class="form-group">

                    <input type="password" class="form-input" id="registerPasswordConfirm" placeholder="请再次输入密码" required>
                    <div class="error-message" id="registerPasswordConfirmError"></div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" class="checkbox-input" id="agreeTerms" required>
                    <label class="checkbox-label" for="agreeTerms">
                        我已阅读并同意<a href="#" style="color: #1A73E8; text-decoration: none;">用户协议</a>和<a href="#" style="color: #1A73E8; text-decoration: none;">隐私政策</a>
                    </label>
                </div>
                
                <button type="submit" class="login-btn" id="registerBtn">注册</button>
            </form>
            
            <div class="footer-text">
                已有账号？<a href="#" onclick="switchTab('login', event)">立即登录</a>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="forgotPasswordModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeForgotPassword()">&times;</button>
            <div class="modal-header">重置密码</div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label class="form-label">手机号/邮箱</label>
                    <input type="text" class="form-input" id="forgotIdentifier" placeholder="请输入注册时的手机号或邮箱" required>
                </div>
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="input-group-wrapper">
                        <input type="text" class="form-input" id="forgotCode" placeholder="请输入验证码" maxlength="6">
                        <span class="input-suffix" id="forgotSendCodeBtn" onclick="sendForgotCode()">发送验证码</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input type="password" class="form-input" id="forgotNewPassword" placeholder="至少8位，包含大小写字母、数字和特殊字符" required>
                </div>
                <button type="submit" class="login-btn">重置密码</button>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let isPasswordLogin = true;
        let smsCountdown = 0;
        let registerCountdown = 0;
        let forgotCountdown = 0;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });
        
        function switchTab(tabName, event) {
            if (event) event.preventDefault();
            
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
        }
        
        function switchLoginMethod() {
            isPasswordLogin = !isPasswordLogin;
            const passwordSection = document.getElementById('passwordLoginSection');
            const smsSection = document.getElementById('smsLoginSection');
            const switchBtn = document.getElementById('switchMethodText');
            const loginBtn = document.getElementById('loginBtn');
            
            if (isPasswordLogin) {
                passwordSection.style.display = 'block';
                smsSection.style.display = 'none';
                switchBtn.textContent = '使用短信登录';
                loginBtn.textContent = '登录';
            } else {
                passwordSection.style.display = 'none';
                smsSection.style.display = 'block';
                switchBtn.textContent = '使用密码登录';
                loginBtn.textContent = '登录';
            }
        }
        
        function sendSmsCode() {
            const btn = document.getElementById('sendCodeBtn');
            if (btn.classList.contains('disabled')) return;
            
            const phone = document.getElementById('loginUsername').value;
            if (!phone) {
                showError('usernameError', '请先输入手机号');
                return;
            }
            
            btn.classList.add('disabled');
            smsCountdown = 60;
            updateCountdown('sendCodeBtn', smsCountdown);
        }
        
        function sendRegisterCode() {
            const btn = document.getElementById('registerSendCodeBtn');
            if (btn.classList.contains('disabled')) return;
            
            const phone = document.getElementById('registerPhone').value;
            if (!phone) {
                showError('phoneError', '请先输入手机号');
                return;
            }
            
            btn.classList.add('disabled');
            registerCountdown = 60;
            updateCountdown('registerSendCodeBtn', registerCountdown);
        }
        
        function sendForgotCode() {
            const btn = document.getElementById('forgotSendCodeBtn');
            if (btn.classList.contains('disabled')) return;
            
            const identifier = document.getElementById('forgotIdentifier').value;
            if (!identifier) {
                alert('请先输入手机号或邮箱');
                return;
            }
            
            btn.classList.add('disabled');
            forgotCountdown = 60;
            updateCountdown('forgotSendCodeBtn', forgotCountdown);
        }
        
        function updateCountdown(btnId, seconds) {
            const btn = document.getElementById(btnId);
            const interval = setInterval(() => {
                seconds--;
                btn.textContent = `${seconds}秒后重试`;
                
                if (seconds <= 0) {
                    clearInterval(interval);
                    btn.textContent = '发送验证码';
                    btn.classList.remove('disabled');
                }
            }, 1000);
        }
        
        function refreshCaptcha() {
            document.getElementById('captchaText').textContent = '刷新中...';
            setTimeout(() => {
                document.getElementById('captchaText').textContent = '刷新';
            }, 500);
        }
        
        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        function clearError(elementId) {
            const errorEl = document.getElementById(elementId);
            errorEl.classList.remove('show');
        }
        
        function checkPasswordStrength() {
            const password = document.getElementById('registerPassword').value;
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            strengthFill.classList.remove('weak', 'medium', 'strong');
            
            if (strength <= 2) {
                strengthFill.classList.add('weak');
                strengthText.textContent = '密码强度：弱';
            } else if (strength <= 3) {
                strengthFill.classList.add('medium');
                strengthText.textContent = '密码强度：中';
            } else {
                strengthFill.classList.add('strong');
                strengthText.textContent = '密码强度：强';
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            clearError('usernameError');
            clearError('passwordError');
            clearError('smsCodeError');
            clearError('captchaError');
            
            const username = document.getElementById('loginUsername').value.trim();
            const captcha = document.getElementById('captcha').value.trim();
            
            if (!username) {
                showError('usernameError', '请输入用户名、邮箱或手机号');
                return;
            }
            
            if (!captcha) {
                showError('captchaError', '请输入图形验证码');
                return;
            }
            
            if (isPasswordLogin) {
                const password = document.getElementById('loginPassword').value;
                if (!password) {
                    showError('passwordError', '请输入密码');
                    return;
                }
            } else {
                const smsCode = document.getElementById('smsCode').value;
                if (!smsCode || smsCode.length !== 6) {
                    showError('smsCodeError', '请输入6位验证码');
                    return;
                }
            }
            
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.classList.add('loading');
            loginBtn.textContent = '登录中...';
            
            setTimeout(() => {
                document.getElementById('loginSuccess').classList.add('show');
                setTimeout(() => {
                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = '登录';
                }, 2000);
            }, 1500);
        });
        
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            clearError('phoneError');
            clearError('registerCodeError');
            clearError('registerPasswordError');
            clearError('registerPasswordConfirmError');
            
            const phone = document.getElementById('registerPhone').value.trim();
            const code = document.getElementById('registerCode').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;
            
            if (!phone) {
                showError('phoneError', '请输入手机号');
                return;
            }
            
            if (!code || code.length !== 6) {
                showError('registerCodeError', '请输入6位验证码');
                return;
            }
            
            if (!password) {
                showError('registerPasswordError', '请输入密码');
                return;
            }
            
            if (password.length < 8) {
